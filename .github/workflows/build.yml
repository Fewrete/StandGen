name: build
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6
      - name: Build
        run: gradle build
      - name: Save jar
        uses: actions/upload-artifact@v4
        with:
          name: standgen-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
      - name: Publish release (only when pushing a tag like v0.1.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
